<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Học Cùng Bé - Trò Chơi Giáo Dục</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .game-card {
      background: linear-gradient(135deg, #FF6B9D 0%, #FFA8C5 100%);
      border-radius: 15px;
      padding: 30px 20px;
      color: white;
      text-decoration: none;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
    }

    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(255, 107, 157, 0.4);
    }

    .game-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      display: block;
    }

    .game-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .game-desc {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .admin-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }

    .admin-links {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .admin-link {
      background: #f8f9fa;
      color: #666;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .admin-link:hover {
      background: #667eea;
      color: white;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 Học Cùng Bé</h1>
    <p class="subtitle">Trò chơi giáo dục thông minh cho trẻ em</p>

    <div class="games-grid">
      <a href="src/games/candy-crush/candy-crush.html" class="game-card">
        <span class="game-icon">🍬</span>
        <div class="game-title">Candy Crush</div>
        <div class="game-desc">Ghép kẹo thông minh, phát triển tư duy logic</div>
      </a>

      <a href="src/games/mini-games/mini-games.html" class="game-card">
        <span class="game-icon">🎯</span>
        <div class="game-title">Mini Games</div>
        <div class="game-desc">Tập hợp các trò chơi nhỏ bổ ích</div>
      </a>
    </div>

    <div class="admin-section">
      <h3 style="color: #666; margin-bottom: 15px;">🔧 Quản lý</h3>
      <div class="admin-links">
        <a href="src/admin/admin.html" class="admin-link">👨‍💼 Admin</a>
        <a href="src/parent/parent-dashboard.html" class="admin-link">👨‍👩‍👧‍👦 Phụ huynh</a>
        <a href="docs/" class="admin-link">📚 Tài liệu</a>
      </div>
    </div>
  </div>
</body>

</html>
